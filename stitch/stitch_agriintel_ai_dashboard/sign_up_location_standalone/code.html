<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={theme:{extend:{"colors":{"on-error":"#ffffff","surface-tint":"#3f6653","surface-variant":"#e1e3e4","tertiary":"#002842","on-tertiary":"#ffffff","surface-container-high":"#e7e8e9","tertiary-fixed-dim":"#94ccff","background":"#f8f9fa","surface-dim":"#d9dadb","primary-fixed-dim":"#a5d0b9","error":"#ba1a1a","on-primary-fixed":"#002114","on-secondary-fixed":"#2e150b","on-surface":"#191c1d","on-secondary-fixed-variant":"#603f33","inverse-primary":"#a5d0b9","surface-container-low":"#f3f4f5","on-primary":"#ffffff","primary-fixed":"#c1ecd4","on-primary-fixed-variant":"#274e3d","surface":"#f8f9fa","on-background":"#191c1d","surface-bright":"#f8f9fa","secondary-fixed":"#ffdbcf","on-secondary":"#ffffff","on-tertiary-container":"#59adef","on-primary-container":"#86af99","primary":"#012d1d","tertiary-container":"#003f63","inverse-on-surface":"#f0f1f2","on-tertiary-fixed":"#001d32","surface-container-lowest":"#ffffff","secondary-fixed-dim":"#ebbcac","on-surface-variant":"#414844","error-container":"#ffdad6","on-secondary-container":"#795548","tertiary-fixed":"#cde5ff","on-error-container":"#93000a","secondary-container":"#fdcdbc","outline-variant":"#c1c8c2","on-tertiary-fixed-variant":"#004b74","secondary":"#7a5649","inverse-surface":"#2e3132","primary-container":"#1b4332","outline":"#717973","surface-container":"#edeeef","surface-container-highest":"#e1e3e4"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"md":"24px","gutter":"24px","base":"4px","margin-desktop":"48px","sm":"16px","xl":"64px","xs":"8px","lg":"40px","margin-mobile":"16px"},"fontFamily":{"headline-lg":["Inter"],"body-lg":["Inter"],"label-md":["Inter"],"label-sm":["Inter"],"body-md":["Inter"],"headline-xl":["Inter"],"headline-md":["Inter"],"headline-lg-mobile":["Inter"]},"fontSize":{"headline-lg":["32px",{"lineHeight":"40px","letterSpacing":"-0.01em","fontWeight":"600"}],"body-lg":["18px",{"lineHeight":"28px","fontWeight":"400"}],"label-md":["14px",{"lineHeight":"20px","letterSpacing":"0.01em","fontWeight":"500"}],"label-sm":["12px",{"lineHeight":"16px","letterSpacing":"0.05em","fontWeight":"600"}],"body-md":["16px",{"lineHeight":"24px","fontWeight":"400"}],"headline-xl":["48px",{"lineHeight":"56px","letterSpacing":"-0.02em","fontWeight":"700"}],"headline-md":["24px",{"lineHeight":"32px","fontWeight":"600"}],"headline-lg-mobile":["24px",{"lineHeight":"32px","fontWeight":"600"}]}}}}</script></head><body class="bg-background font-body-md text-on-surface"><main class="relative bg-background min-h-screen flex items-center justify-center"><div class="flex flex-col w-full p-margin-desktop bg-background">
<div class="max-w-2xl w-full mx-auto flex flex-col gap-xl py-xl">
<!-- Progress Indicator -->
<div class="flex flex-col gap-xs w-full relative z-10">
<div class="flex justify-between items-end mb-sm">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Step 2 of 5</span>
<span class="font-body-md text-body-md text-primary font-bold">20%</span>
</div>
<div class="h-2 w-full bg-surface-container-high rounded-full overflow-hidden flex">
<div class="w-2/5 bg-primary h-full rounded-full transition-all duration-500 ease-out shadow-[0_0_8px_rgba(1,45,29,0.4)]"></div>
</div>
</div>
<!-- Header -->
<div class="flex flex-col gap-sm relative z-10">
<h1 class="font-headline-xl text-headline-xl text-on-background">Where is your farm?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-lg">
                AgriIntel uses your location to provide hyper-local weather forecasts, soil analysis, and regional market intelligence.
            </p>
</div>
<!-- Current Location Quick Action -->
<div class="relative group cursor-pointer overflow-hidden rounded-xl bg-surface-container-low hover:bg-surface-container transition-colors duration-300 shadow-sm hover:shadow-md">
<div class="absolute inset-0 bg-gradient-to-r from-primary-fixed/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
<button class="w-full flex items-center justify-between p-md relative z-10 text-left">
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-primary-fixed flex items-center justify-center shadow-[0_4px_12px_rgba(193,236,212,0.5)] group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-on-primary-fixed" style="font-variation-settings: 'FILL' 1;">my_location</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-xs">Use My Current Location</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Fastest way to get set up</p>
</div>
</div>
<span class="material-symbols-outlined text-primary group-hover:translate-x-2 transition-transform duration-300">arrow_forward</span>
</button>
</div>
<div class="flex items-center gap-md my-sm opacity-60">
<div class="h-[1px] flex-1 bg-outline-variant"></div>
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Or enter manually</span>
<div class="h-[1px] flex-1 bg-outline-variant"></div>
</div>
<!-- Manual Entry Form -->
<div class="bg-surface-container-lowest rounded-[24px] p-xl shadow-lg shadow-surface-tint/5 relative overflow-hidden group/form">
<!-- Decorative background blur -->
<div class="absolute -top-32 -right-32 w-64 h-64 bg-primary-fixed-dim/30 rounded-full blur-3xl group-hover/form:bg-primary-fixed-dim/40 transition-colors duration-700"></div>
<form class="flex flex-col gap-lg relative z-10">
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- State -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-md text-label-md text-on-surface-variant pl-xs" for="state">State</label>
<div class="relative">
<select class="w-full h-14 bg-surface-container-low text-on-surface font-body-md text-body-md rounded-xl px-sm appearance-none outline-none focus:ring-2 focus:ring-primary focus:bg-surface-container transition-all cursor-pointer" id="state">
<option disabled="" selected="" value="">Select your state</option>
<option value="mh">Maharashtra</option>
<option value="gj">Gujarat</option>
<option value="rj">Rajasthan</option>
<option value="up">Uttar Pradesh</option>
<option value="mp">Madhya Pradesh</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- District -->
<div class="flex flex-col gap-xs relative">
<label class="font-label-md text-label-md text-on-surface-variant pl-xs" for="district">District</label>
<div class="relative">
<select class="w-full h-14 bg-surface-container-low text-on-surface font-body-md text-body-md rounded-xl px-sm appearance-none outline-none focus:ring-2 focus:ring-primary focus:bg-surface-container transition-all cursor-pointer" id="district">
<option disabled="" selected="" value="">Select district</option>
<option value="pune">Pune</option>
<option value="nashik">Nashik</option>
<option value="nagpur">Nagpur</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Village / City -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant pl-xs" for="village">Village / City</label>
<input class="w-full h-14 bg-surface-container-low text-on-surface font-body-md text-body-md rounded-xl px-sm outline-none focus:ring-2 focus:ring-primary focus:bg-surface-container transition-all placeholder:text-on-surface-variant/50" id="village" placeholder="e.g. Shirur" type="text"/>
</div>
<!-- PIN Code -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant pl-xs" for="pincode">PIN Code</label>
<input class="w-full h-14 bg-surface-container-low text-on-surface font-body-md text-body-md rounded-xl px-sm outline-none focus:ring-2 focus:ring-primary focus:bg-surface-container transition-all placeholder:text-on-surface-variant/50 font-mono tracking-widest" id="pincode" maxlength="6" placeholder="6 digits" type="text"/>
</div>
</div>
</form>
</div>
<!-- Navigation -->
<div class="flex items-center justify-between pt-md mt-auto">
<button class="flex items-center gap-xs px-lg py-sm rounded-xl font-label-md text-label-md text-primary hover:bg-surface-container transition-colors group">
<span class="material-symbols-outlined group-hover:-translate-x-1 transition-transform">arrow_back</span>
                Back
            </button>
<button class="flex items-center gap-sm px-xl py-sm rounded-xl bg-primary text-on-primary font-label-md text-label-md shadow-lg shadow-primary/20 hover:shadow-xl hover:shadow-primary/30 hover:-translate-y-0.5 transition-all group">
                Continue
                <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</div>
</div></main></body></html>

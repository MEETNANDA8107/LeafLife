<h1 class="font-headline-xl text-headline-xl text-on-surface">Welcome Back</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[300px]">Sign in to manage your farm's intelligence.</p>

<div class="flex bg-surface-container p-1 rounded-full relative">

                        Send OTP
                        <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">send</span>

                    Don't have an account? <a class="font-label-md text-label-md text-primary font-bold hover:underline underline-offset-4 decoration-2" href="#">Sign up</a>
</p>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const tabs = document.querySelectorAll('.login-tab-btn');
        const forms = document.querySelectorAll('.login-form');
        const indicator = document.getElementById('tab-indicator');
        const container = document.getElementById('login-container');
        
        container.style.opacity = '0';
        setTimeout(() => {
            container.style.transition = 'opacity 0.8s ease-out';
            container.style.opacity = '1';
        }, 50);

        tabs.forEach((tab, index) => {
            tab.addEventListener('click', () => {
                
                tabs.forEach(t => {
                    t.classList.remove('text-on-surface', 'font-semibold');
                    t.classList.add('text-on-surface-variant');
                });
                tab.classList.remove('text-on-surface-variant');
                tab.classList.add('text-on-surface', 'font-semibold');

                
                indicator.style.transform = `translateX(${index * 100}%)`;

                
                const targetId = tab.getAttribute('data-target');
                forms.forEach(form => {
                    if (form.id === targetId) {
                        form.classList.remove('opacity-0', 'pointer-events-none');
                        form.classList.remove('translate-x-[120%]', '-translate-x-[120%]');
                        form.classList.add('opacity-100', 'translate-x-0');
                    } else {
                        form.classList.remove('opacity-100', 'translate-x-0');
                        form.classList.add('opacity-0', 'pointer-events-none');
                        
                        if (index === 0) { 
                            form.classList.add('translate-x-[120%]');
                        } else { 
                            form.classList.add('-translate-x-[120%]');
                        }
                    }
                });
            });
        });

        
        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggle-icon');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });
    });
</script></main></div></body></html>

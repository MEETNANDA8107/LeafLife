<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={theme:{extend:{"colors":{"on-error":"#ffffff","surface-tint":"#3f6653","surface-variant":"#e1e3e4","tertiary":"#002842","on-tertiary":"#ffffff","surface-container-high":"#e7e8e9","tertiary-fixed-dim":"#94ccff","background":"#f8f9fa","surface-dim":"#d9dadb","primary-fixed-dim":"#a5d0b9","error":"#ba1a1a","on-primary-fixed":"#002114","on-secondary-fixed":"#2e150b","on-surface":"#191c1d","on-secondary-fixed-variant":"#603f33","inverse-primary":"#a5d0b9","surface-container-low":"#f3f4f5","on-primary":"#ffffff","primary-fixed":"#c1ecd4","on-primary-fixed-variant":"#274e3d","surface":"#f8f9fa","on-background":"#191c1d","surface-bright":"#f8f9fa","secondary-fixed":"#ffdbcf","on-secondary":"#ffffff","on-tertiary-container":"#59adef","on-primary-container":"#86af99","primary":"#012d1d","tertiary-container":"#003f63","inverse-on-surface":"#f0f1f2","on-tertiary-fixed":"#001d32","surface-container-lowest":"#ffffff","secondary-fixed-dim":"#ebbcac","on-surface-variant":"#414844","error-container":"#ffdad6","on-secondary-container":"#795548","tertiary-fixed":"#cde5ff","on-error-container":"#93000a","secondary-container":"#fdcdbc","outline-variant":"#c1c8c2","on-tertiary-fixed-variant":"#004b74","secondary":"#7a5649","inverse-surface":"#2e3132","primary-container":"#1b4332","outline":"#717973","surface-container":"#edeeef","surface-container-highest":"#e1e3e4"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"md":"24px","gutter":"24px","base":"4px","margin-desktop":"48px","sm":"16px","xl":"64px","xs":"8px","lg":"40px","margin-mobile":"16px"},"fontFamily":{"headline-lg":["Inter"],"body-lg":["Inter"],"label-md":["Inter"],"label-sm":["Inter"],"body-md":["Inter"],"headline-xl":["Inter"],"headline-md":["Inter"],"headline-lg-mobile":["Inter"]},"fontSize":{"headline-lg":["32px",{"lineHeight":"40px","letterSpacing":"-0.01em","fontWeight":"600"}],"body-lg":["18px",{"lineHeight":"28px","fontWeight":"400"}],"label-md":["14px",{"lineHeight":"20px","letterSpacing":"0.01em","fontWeight":"500"}],"label-sm":["12px",{"lineHeight":"16px","letterSpacing":"0.05em","fontWeight":"600"}],"body-md":["16px",{"lineHeight":"24px","fontWeight":"400"}],"headline-xl":["48px",{"lineHeight":"56px","letterSpacing":"-0.02em","fontWeight":"700"}],"headline-md":["24px",{"lineHeight":"32px","fontWeight":"600"}],"headline-lg-mobile":["24px",{"lineHeight":"32px","fontWeight":"600"}]}}}}</script></head><body class="bg-background font-body-md text-on-surface"><main class="relative bg-background min-h-screen"><div class="flex flex-col w-full items-center justify-center py-xl px-sm relative min-h-screen">
<div class="absolute top-0 right-0 w-96 h-96 bg-primary-fixed/20 rounded-full blur-[100px] pointer-events-none -mr-20 -mt-20"></div>
<div class="absolute bottom-0 left-0 w-80 h-80 bg-tertiary-fixed-dim/20 rounded-full blur-[80px] pointer-events-none -ml-20 -mb-20"></div>
<div class="w-full max-w-2xl bg-surface-container-lowest rounded-[24px] shadow-xl p-lg relative z-10">
<div class="flex items-center justify-between mb-xl">
<div>
<h1 class="font-headline-xl text-headline-xl text-on-surface mb-xs tracking-tight">Create Your Account</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Step 1 of 5: Basic Details</p>
</div>
<div class="w-16 h-16 rounded-full bg-surface-container-low flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-primary text-[32px]">account_circle</span>
</div>
</div>
<div class="flex gap-2 mb-xl">
<div class="h-2 flex-1 rounded-full bg-primary relative overflow-hidden">
<div class="absolute inset-0 bg-white/20 animate-pulse"></div>
</div>
<div class="h-2 flex-1 rounded-full bg-surface-container-high"></div>
<div class="h-2 flex-1 rounded-full bg-surface-container-high"></div>
<div class="h-2 flex-1 rounded-full bg-surface-container-high"></div>
<div class="h-2 flex-1 rounded-full bg-surface-container-high"></div>
</div>
<form class="space-y-md">
<div class="flex flex-col gap-xs relative group">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="fullName">Full Legal Name</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant z-10 group-focus-within:text-primary transition-colors">badge</span>
<input class="w-full bg-surface-container-low rounded-xl px-sm py-sm pl-12 font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary transition-shadow h-14" id="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-xs relative group">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="mobile">Mobile Number</label>
<div class="flex gap-sm h-14">
<div class="relative flex items-center flex-1">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant z-10 group-focus-within:text-primary transition-colors">smartphone</span>
<input class="w-full bg-surface-container-low rounded-xl px-sm py-sm pl-12 font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary transition-shadow h-full" id="mobile" placeholder="+1 (555) 000-0000" required="" type="tel"/>
</div>
<button class="px-md rounded-xl bg-surface-container-highest text-on-surface hover:bg-primary-fixed-dim hover:text-on-primary-fixed font-label-md text-label-md transition-colors shadow-sm h-full whitespace-nowrap flex items-center gap-xs" type="button">
<span>Send OTP</span>
<span class="material-symbols-outlined text-[18px]">send</span>
</button>
</div>
</div>
<div class="flex flex-col gap-xs relative group">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="email">Email Address <span class="text-on-surface-variant/60 lowercase">(Optional)</span></label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant z-10 group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full bg-surface-container-low rounded-xl px-sm py-sm pl-12 font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary transition-shadow h-14" id="email" placeholder="jane.doe@farm.com" type="email"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="flex flex-col gap-xs relative group">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant z-10 group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-surface-container-low rounded-xl px-sm py-sm pl-12 pr-12 font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary transition-shadow h-14" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-sm text-on-surface-variant hover:text-primary z-10 flex items-center justify-center w-8 h-8 rounded-full hover:bg-surface-container-highest transition-colors" onclick="togglePassword('password', 'toggleIcon1')" type="button">
<span class="material-symbols-outlined text-[20px]" id="toggleIcon1">visibility</span>
</button>
</div>
</div>
<div class="flex flex-col gap-xs relative group">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="confirmPassword">Confirm Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant z-10 group-focus-within:text-primary transition-colors">swipe_left_alt</span>
<input class="w-full bg-surface-container-low rounded-xl px-sm py-sm pl-12 pr-12 font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary transition-shadow h-14" id="confirmPassword" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-sm text-on-surface-variant hover:text-primary z-10 flex items-center justify-center w-8 h-8 rounded-full hover:bg-surface-container-highest transition-colors" onclick="togglePassword('confirmPassword', 'toggleIcon2')" type="button">
<span class="material-symbols-outlined text-[20px]" id="toggleIcon2">visibility</span>
</button>
</div>
</div>
</div>
<div class="pt-lg flex items-center justify-between">
<button class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors flex items-center gap-xs px-sm py-xs -ml-sm" type="button">
<span class="material-symbols-outlined">arrow_back</span>
             Back to Login
          </button>
<button class="bg-primary text-on-primary rounded-xl px-xl py-sm font-label-md text-label-md hover:bg-primary-container shadow-md hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex items-center gap-sm group" type="button">
              Continue
              <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</form>
</div>
</div>
<script>
  function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === "password") {
      input.type = "text";
      icon.textContent = "visibility_off";
    } else {
      input.type = "password";
      icon.textContent = "visibility";
    }
  }
</script></main></body></html>
